Weights:
  model: 'Pi3'
  VGGT: '/path/to/weights/model.pt'
  Pi3: '/path/to/weights/pi3/model.safetensors'
  Map:  '/path/to/weights/map_anything'
  DBoW: '/path/to/weights/ORBvoc.txt'
  SALAD: '/path/to/weights/dino_salad.ckpt'
  DNIO: '/path/to/weights/dinov2_vitb14_pretrain.pth'

Model:
  chunk_size: 60
  overlap: 30
  loop_chunk_size: 20
  loop_enable: True
  useDBoW: False
  delete_temp_files: True
  align_method: 'turboreg'
  using_sim3: True
  reference_frame_mid: False

  calib: False
  h: 376
  w: 1241

  IRLS:
    delta: 0.1
    max_iters: 5
    tol: 1e-9

  Pointcloud_Save:
    sample_ratio: 0.015
    conf_threshold_coef: 0.75
    use_confidence_filtering: true

# TurboReg (ScaleTurboRegGPU) parameters
TurboReg:
  max_N: 7000
  epsilon_scale: 0.15
  num_pivot: 2000
  radiu_nms: 0.15
  tau_inlier: 0.01
  metric_str: 'IN'
  k_neighbors: 30
  num_iterations: 2
  graph_k: 80
  trim_ratio: 0.1
  min_pair_dist: 0.004
  local_scale_min: 0.5
  local_scale_max: 2.0
  local_scale_diff: -1.0
  local_scale_mode: 'union_median'
  # Degenerate-edge fallback to weighted Umeyama when Sim(3) estimate is implausible
  fallback_max_rot_deg: 30.0
  fallback_max_logscale: 0.3

Loop:
  DBoW:
    thresh: 0.034
    num_repeat: 3
    NMS: 25

  SALAD:
    image_size: [336, 336]
    batch_size: 32
    similarity_threshold: 0.85
    top_k: 5
    use_nms: True
    nms_threshold: 25

  SIM3_Optimizer:
    lang_version: 'cpp'
    max_iterations: 30
    lambda_init: 1e-6
